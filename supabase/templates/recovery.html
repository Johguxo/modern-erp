<!doctype html>
<html lang="es-PE">
  <body style="font-family: Inter, Arial, sans-serif; color: #0f172a; background: #f4f6f9; padding: 24px">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px">
      <h1 style="font-size: 20px; margin: 0 0 12px">Restablece tu contraseña</h1>
      <p style="margin: 0 0 16px; color: #475569">
        Recibimos una solicitud para restablecer la contraseña de tu cuenta de LinkUs. El enlace vence en 1 hora.
      </p>
      <p style="margin: 0 0 24px">
        <a href="{{ .SiteURL }}/restablecer?token_hash={{ .TokenHash }}"
           style="display: inline-block; background: #0b5cd5; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 10px; font-weight: 600">
          Restablecer contraseña
        </a>
      </p>
      <p style="margin: 0; font-size: 12px; color: #64748b">
        Si no lo pediste, puedes ignorar este correo: tu contraseña no cambiará.
      </p>
    </div>
  </body>
</html>
